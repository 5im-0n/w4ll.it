name: Build signed APK on tag

on:
  push:
    tags:
      - "*"

# Required for the workflow to create a GitHub Release and upload its APK asset.
permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The Gradle wrapper may be committed without its Unix executable bit.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::One or more Android signing secrets are missing. See the repository setup instructions."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/w4ll-release-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk w4ll.apk

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: w4ll.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/w4ll-release-key.jks"
