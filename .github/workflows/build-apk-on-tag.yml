name: Build APK on tag

on:
  push:
    tags:
      - "*"

# Required for the workflow to create a GitHub Release and upload its APK asset.
permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The Gradle wrapper may be committed without its Unix executable bit.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Debug APKs are automatically signed with the Android debug key and can be installed.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
