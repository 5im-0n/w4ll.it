# Submission metadata for F-Droid's fdroiddata repository.
# The GitHub release workflow updates the version fields and commit tag in this
# template. Copy it to fdroiddata/metadata/it.w4ll.yml for submission; F-Droid
# resolves the release tag to the immutable source revision it builds.
#
# This needs a new release because F-Droid's scanner reports OpenCensus only in
# the Android Gradle Plugin build tooling (not in the app runtime APK). The
# submitted build uses the current wrapper, which pins both Gradle's distribution
# SHA-256 and all executable resolved build dependencies in
# gradle/verification-metadata.xml. The metadata includes checksums for
# platform-specific artifacts selected by Windows development machines and Linux
# CI/F-Droid builders. IDE-only source and Javadoc archives are explicitly
# trusted because Android Studio downloads them only for code navigation; they
# are never executed or packaged in the APK.
AntiFeatures:
  NonFreeNet:
    en-US: Requires Wallhaven, a non-libre third-party wallpaper catalogue and image service.
Categories:
  - Multimedia
  - Wallpaper
License: MIT
SourceCode: https://github.com/5im-0n/w4ll.it
IssueTracker: https://github.com/5im-0n/w4ll.it/issues

AutoName: w4ll.it

RepoType: git
Repo: https://github.com/5im-0n/w4ll.it.git

Builds:
  - versionName: '1.2.2'
    versionCode: 7
    commit: v1.2.2
    gradle:
      - yes

AutoUpdateMode: Version
