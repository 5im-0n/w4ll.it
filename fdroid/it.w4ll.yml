# Submission metadata for F-Droid's fdroiddata repository.
# Copy this file to fdroiddata/metadata/it.w4ll.yml after tagging a release, then
# replace RELEASE_COMMIT with that tag's full commit hash. The main F-Droid repo
# builds from that immutable commit rather than from this working tree.
#
# This needs a new release because F-Droid's scanner reports OpenCensus only in
# the Android Gradle Plugin build tooling (not in the app runtime APK). The
# submitted build should use the current wrapper, which pins both Gradle's
# distribution SHA-256 and every resolved build dependency in
# gradle/verification-metadata.xml.
AntiFeatures:
  NonFreeNet:
    en-US: Requires Wallhaven, a non-libre third-party wallpaper catalogue and image service.
Categories:
  - Multimedia
  - Wallpaper
License: MIT
SourceCode: https://github.com/5im-0n/w4ll.it
IssueTracker: https://github.com/5im-0n/w4ll.it/issues

AutoName: w4ll.it

RepoType: git
Repo: https://github.com/5im-0n/w4ll.it.git

Builds:
  - versionName: '1.0.1'
    versionCode: 2
    commit: RELEASE_COMMIT
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0.1'
CurrentVersionCode: 2
